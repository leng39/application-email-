<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply - Ka Phoy Agency</title>
  <script>
    const email = "kaphoyagency@outlook.com";
    const subject = "Job Application / Permohonan Jawatan Kosong - Admin Assistant / Pembantu Tadbir";
    const body = "Hello Ka Phoy Agency Team / Salam Sejahtera Ka Phoy Agency,\n\nI would like to apply for the open position. Here are my details / Berikut adalah maklumat saya:\n\n- Full Name / Nama Penuh: \n- Phone Number / No. Telefon: \n- Position Applied For / Jawatan Dipohon: \n- Highest Qualification / Kelayakan Tertinggi: \n- Availability / Tarikh Boleh Mula Bekerja: \n\nPlease find my resume attached to this email. / Bersama-sama ini disertakan resume saya untuk rujukan pihak tuan/puan.";

    const mailtoLink = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body.replace(/\r?\n/g, "\r\n"))}`;
    window.location.replace(mailtoLink);
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px;">
  <div style="background: #ffffff; max-width: 420px; width: 100%; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); text-align: center; border: 1px solid #e2e8f0;">
    <h2 style="margin: 0 0 8px; font-size: 20px;">Ka Phoy Agency</h2>
    <p style="margin: 0 0 20px; font-size: 14px; color: #475569; line-height: 1.5;">
      Opening your email app with the pre-filled application form...<br>
      <span style="font-size: 13px; color: #64748b;">Membuka aplikasi e-mel anda...</span>
    </p>
    <a id="fallbackBtn" href="#" style="display: inline-block; width: 100%; box-sizing: border-box; padding: 14px 20px; background: #059669; color: #ffffff; text-decoration: none; border-radius: 12px; font-weight: 700; font-size: 15px;">
      Tap to Open Email App / Buka E-mel
    </a>
    <p style="margin: 20px 0 0; font-size: 12px; color: #64748b;">
      Or send your resume directly to:<br>
      <strong style="color: #0f172a; user-select: all;">kaphoyagency@outlook.com</strong>
    </p>
  </div>
  <script>
    document.getElementById('fallbackBtn').href = mailtoLink;
  </script>
</body>
</html>
